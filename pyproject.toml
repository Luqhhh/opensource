[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-exampleproof"
version = "0.1.0"
description = "Execute Python documentation examples and verify evidence-backed repair proposals."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
exampleproof = "exampleproof.cli:main"

[tool.setuptools.packages.find]
include = ["exampleproof*"]

[tool.setuptools.package-data]
exampleproof = ["licenses/*.txt"]
