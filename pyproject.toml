[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-repopath"
version = "0.1.0"
description = "RepoPath: a source-grounded learning workspace for open-source projects."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
repopath = "repopath.cli:main"
exampleproof = "exampleproof.cli:main"

[tool.setuptools.packages.find]
include = ["exampleproof*", "repopath*"]

[tool.setuptools.package-data]
exampleproof = ["licenses/*.txt", "web/*.html", "web/*.css", "web/*.js", "learner_web/*.html", "learner_web/*.css", "learner_web/*.js"]
