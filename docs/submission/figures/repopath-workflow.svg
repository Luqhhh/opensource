    <g fill="#173c35" font-size="29" font-weight="650"><text x="141" y="272">说明目标</text><text x="526" y="272">开始行动</text><text x="911" y="272">核对与求助</text><text x="1296" y="272">记录与恢复</text></g>
    <g fill="#3f5b4f" font-size="23">
