<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title description">
  <title id="title">源途 RepoPath：一次学习如何进行</title>
  <desc id="description">让下一步、相关原文和已有记录始终相连。学习过程依次包括说明目标、开始行动、核对与求助、记录与恢复。用户完成标记、AI反馈与实际运行分别保存，真实体验另行观察。</desc>
