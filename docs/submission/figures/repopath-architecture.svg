<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title description">
  <title id="title">源途 RepoPath 系统架构</title>
  <desc id="description">原文与模型分开，学习记录留在本机。项目输入、索引与模型、学习工作台、记录与运行四个部分依次连接。第三方模型负责生成；程序负责来源、记录、输入边界和受限执行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#226b59" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1600" height="700" fill="#f7f6ef"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="66" y="90" fill="#173c35" font-size="46" font-weight="700">系统架构</text>
    <text x="66" y="140" fill="#536b61" font-size="24">原文与模型分开，学习记录留在本机。</text>
    <path d="M66 177H144a14 14 0 0 0 14-14" fill="none" stroke="#b9cdbd" stroke-width="2" stroke-linecap="round"/>
    <circle cx="66" cy="177" r="4" fill="#b49c73"/>
    <g fill="#fffefb" stroke="#c6d6cc" stroke-width="1.5">
      <rect x="66" y="218" width="320" height="300" rx="18"/>
      <rect x="451" y="218" width="320" height="300" rx="18"/>
      <rect x="836" y="218" width="320" height="300" rx="18"/>
      <rect x="1221" y="218" width="320" height="300" rx="18"/>
    </g>
    <g fill="#e7f1e9">
      <path d="M84 218H368a18 18 0 0 1 18 18V300H66V236a18 18 0 0 1 18-18Z"/>
      <path d="M469 218H753a18 18 0 0 1 18 18V300H451V236a18 18 0 0 1 18-18Z"/>
      <path d="M854 218H1138a18 18 0 0 1 18 18V300H836V236a18 18 0 0 1 18-18Z"/>
      <path d="M1239 218H1523a18 18 0 0 1 18 18V300H1221V236a18 18 0 0 1 18-18Z"/>
    </g>
    <g fill="#226b59"><circle cx="108" cy="261" r="19"/><circle cx="493" cy="261" r="19"/><circle cx="878" cy="261" r="19"/><circle cx="1263" cy="261" r="19"/></g>
    <g fill="#fffefb" font-size="16" font-weight="600" text-anchor="middle"><text x="108" y="267">01</text><text x="493" y="267">02</text><text x="878" y="267">03</text><text x="1263" y="267">04</text></g>
    <g fill="#173c35" font-size="29" font-weight="650"><text x="141" y="272">项目输入</text><text x="526" y="272">索引与模型</text><text x="911" y="272">学习工作台</text><text x="1296" y="272">记录与运行</text></g>
    <g fill="#3f5b4f" font-size="23">
      <text x="90" y="350">GitHub / ZIP</text><text x="90" y="395">固定快照与来源</text><text x="90" y="440">只读、过滤与限额</text>
      <text x="475" y="350">原文片段 / 符号线索</text><text x="475" y="395">目标与当前任务</text><text x="475" y="440">发送预览 / 引用绑定</text>
      <text x="860" y="350">任务与并排原文</text><text x="860" y="395">问答、排错与练习</text><text x="860" y="440">笔记、进度与调整</text>
      <text x="1245" y="350">本机持久记录</text><text x="1245" y="395">可选 Bubblewrap</text><text x="1245" y="440">无网络、失败关闭</text>
    </g>
    <g fill="none" stroke="#226b59" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"><path d="M397 368H435"/><path d="M782 368H820"/><path d="M1167 368H1205"/></g>
    <text x="66" y="585" fill="#3f6655" font-size="25">第三方模型负责生成；程序负责来源、记录、输入边界和受限执行。</text>
    <path d="M66 610H1541" stroke="#dde6dc"/>
    <g transform="translate(66 631)"><rect width="34" height="34" rx="9" fill="#173c35"/><g transform="translate(-1 -1)"><path d="M10 27V20a4 4 0 0 1 4-4h8a5 5 0 0 0 0-10h-4" fill="none" stroke="#f5f6ee" stroke-width="2.3" stroke-linecap="round"/><circle cx="10" cy="27" r="2.8" fill="#d7bc83"/><circle cx="18" cy="6" r="2.8" fill="#f5f6ee"/></g></g>
    <text x="113" y="655" fill="#173c35" font-size="20" font-weight="600">源途 · RepoPath</text>
    <text x="296" y="655" fill="#657f71" font-size="18">｜ 自绘架构说明</text>
    <text x="1541" y="655" fill="#657f71" font-size="18" text-anchor="end">开源项目学习工作台</text>
  </g>
</svg>
